services:
  memepot-landing:
    build:
      context: .
    container_name: memepot-landing
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.memepot-landing.rule=Host(`memepot.nodehub.studio`)
      - traefik.http.routers.memepot-landing.entrypoints=websecure
      - traefik.http.routers.memepot-landing.tls=true
      - traefik.http.routers.memepot-landing.tls.certresolver=letsencrypt
      - traefik.http.services.memepot-landing.loadbalancer.server.port=80

networks:
  traefik:
    external: true
